# Synthetic analysis exercising shape systematics (jet energy scale, jet energy
# resolution, per-object scale) on Cascade column files. Inputs are generated by
# test/pipeline/test_shape_pipeline.jl under ${inputs}; the correction files in
# this folder hold synthetic values with the CMS JME input conventions.

[analysis]
name = "shape_test"
lumi_pb = 100.0
workdir = "work"

[paths]
inputs = "inputs"

[merge]
yield_variable = "njet"

[[samples]]
name = "sigA"
kind = "mc"
xsec_pb = 2.0
branching_ratio = 0.5
format = "cols"
files = ["${inputs}/sigA/*.cols"]

[[samples]]
name = "bkgB"
kind = "mc"
xsec_pb = 3.0
format = "cols"
files = ["${inputs}/bkgB/*.cols"]

[[samples]]
name = "dataEG"
kind = "data"
stream = "EGamma"
format = "cols"
files = ["${inputs}/dataEG/*.cols"]

[triggers]
priority = ["EGamma"]
mc = ["single_e", "single_mu"]

[triggers.groups]
single_e = ["HLT_Ele32_WPTight_Gsf"]
single_mu = ["HLT_IsoMu24"]

[triggers.streams]
EGamma = ["single_e"]

[[objects]]
name = "electrons"
collection = "Electron"
cut = "pt > 35.0 && abs(eta) < 2.4 && cutBased >= 4"

[[objects]]
name = "muons"
collection = "Muon"
cut = "pt > 35.0 && abs(eta) < 2.4 && tightId"

[[objects]]
name = "jets"
collection = "Jet"
cut = "pt > 30.0 && abs(eta) < 2.4 && (jetId & 2) != 0"
clean = { against = ["electrons", "muons"], dr = 0.4 }
sort_by = "pt"

[variables]
njet = "length(jets)"

[weights]
mc = ["genWeight"]
data = []

[[cuts]]
name = "trigger"
expr = "trigger"

[[cuts]]
name = "one_lepton"
expr = "length(electrons) + length(muons) >= 1"

[[cuts]]
name = "met"
expr = "PuppiMET_pt > 20.0"

[[cuts]]
name = "njet_ge1"
expr = "njet >= 1"

[[cuts]]
name = "njet_ge2"
expr = "njet >= 2"

[[regions]]
name = "ge1j"
after = "njet_ge1"

[[regions]]
name = "ge2j"
after = "njet_ge2"

[[histograms]]
name = "njet"
range = [0.5, 1.0, 7.5]
values = ["njet"]

[[histograms]]
name = "jet1_pt"
range = [30.0, 10.0, 300.0]
values = ["jets.pt[1]"]
when = "njet >= 1"

[[histograms]]
name = "jet1_mass"
range = [0.0, 2.0, 60.0]
values = ["jets.mass[1]"]
when = "njet >= 1"

[[histograms]]
name = "met"
range = [20.0, 10.0, 200.0]
values = ["PuppiMET_pt"]

[[histograms]]
name = "mu_pt"
range = [35.0, 5.0, 150.0]
values = ["muons.pt[1]"]
when = "length(muons) >= 1"

# ---------------------------------------------------------------- shape systematics
[[shape_variations]]
name = "JES_Total"
collection = "Jet"
kind = "jes"
corrections = "test_jerc.json"
source = "Test_JES_Total"
met = "PuppiMET"

[[shape_variations]]
name = "JER"
collection = "Jet"
kind = "jer"
corrections = "test_jerc.json"
resolution = "Test_PtResolution"
scale_factor = "Test_ScaleFactor"
smear_file = "test_jer_smear.json"
met = "PuppiMET"
nominal = false

[[shape_variations]]
name = "MuScale"
collection = "Muon"
kind = "scale"
fields = ["pt"]
up = "abs(eta) < 1.2 ? 1.01 : 1.02"
down = "abs(eta) < 1.2 ? 0.99 : 0.98"
samples = ["sigA"]
