# ttbar -> e mu control analysis (AN-22-103, arXiv:2303.10680), Run3Summer22
# NanoAODv12 MC and Run2022C data (run 356309-356615, 1.21 fb^-1).
#
# ONE file controls the whole analysis. Sections are defined once below; the
# [options] switches decide what is active, and [profiles.*] only flip switches:
#
#   cascade run analyses/ttbar_emu/analysis.toml                     # baseline
#   cascade run analyses/ttbar_emu/analysis.toml --profile sf        # + lepton/pileup SFs
#   cascade run analyses/ttbar_emu/analysis.toml --profile phase2    # + JES/JER, fit, plots
#   cascade run analyses/ttbar_emu/analysis.toml --profile jer_candidate
#   cascade check analyses/ttbar_emu/analysis.toml --profile phase2  # print resolved setup
#
# baseline = genWeight only; reproduces the reference numbers bit-exactly
# (data 5905/3836, MC 6434.931560809516/4235.210227397772 for >=1/>=2 jets).
# Full key reference: docs/CONFIG.md.

# ---------------------------------------------------------------- switches
[options]
default_profile = "baseline"
corrections = false             # true, false or a list of correction names
shape_variations = false        # true, false or a list of shape variation names
fit = false
# jer_nominal = false           # override nominal JER smearing of every JER entry

[profiles.baseline]

[profiles.sf.options]
corrections = true

[profiles.phase2.options]
corrections = true
shape_variations = true
fit = true
jer_nominal = false             # technical demo: unsmeared nominal

[profiles.jer_candidate.options]
corrections = true
shape_variations = true
fit = true
jer_nominal = true              # consistently smeared nominal (see JER_READINESS.md)

[analysis]
name = "ttbar_emu"
lumi_pb = 1210.0                # [P] Sec.1, 3: 1.21 fb^-1
workdir = "cascade_out/ttbar_emu"

[paths]
mc = "~/nano_slim/mc/Run3Summer22NanoAODv12"
data = "~/nano_slim/data/Run2022C"
jsonpog = "/cvmfs/cms.cern.ch/rsync/cms-nanoAOD/jsonpog-integration/POG"

[merge]
yield_variable = "njet"         # every selected event fills it once (overflow in last bin)

# ---------------------------------------------------------------- samples
# MC cross sections [pb] are the pre-validation values of the reference
# plot_common.jl; sigma = xsec_pb * branching_ratio.

[[samples]]
name = "TTto2L2Nu"
kind = "mc"
group = "ttbar"
xsec_pb = 924.0
branching_ratio = 0.1061
files = ["${mc}/TTto2L2Nu_TuneCP5_13p6TeV_powheg-pythia8/NANOAODSIM/*/*/*.root"]

[[samples]]
name = "TWminusto2L2Nu"
kind = "mc"
group = "single_top"
xsec_pb = 43.95
branching_ratio = 0.1061
files = ["${mc}/TWminusto2L2Nu_TuneCP5_13p6TeV_powheg-pythia8/NANOAODSIM/*/*/*.root"]

[[samples]]
name = "TbarWplusto2L2Nu"
kind = "mc"
group = "single_top"
xsec_pb = 43.95
branching_ratio = 0.1061
files = ["${mc}/TbarWplusto2L2Nu_TuneCP5_13p6TeV_powheg-pythia8/NANOAODSIM/*/*/*.root"]

[[samples]]
name = "WWto2L2Nu"
kind = "mc"
group = "diboson"
xsec_pb = 125.8
branching_ratio = 0.1061
files = ["${mc}/WWto2L2Nu_TuneCP5_13p6TeV_powheg-pythia8/NANOAODSIM/*/*/*.root"]

[[samples]]
name = "WZto3LNu"
kind = "mc"
group = "diboson"
xsec_pb = 4.92
files = ["${mc}/WZto3LNu_TuneCP5_13p6TeV_powheg-pythia8/NANOAODSIM/*/*/*.root"]

[[samples]]
name = "WZto2L2Q"
kind = "mc"
group = "diboson"
xsec_pb = 3.5
files = ["${mc}/WZto2L2Q_TuneCP5_13p6TeV_powheg-pythia8/NANOAODSIM/*/*/*.root"]

[[samples]]
name = "DYto2L_MLL50"
kind = "mc"
group = "zjets"
xsec_pb = 6346.0
files = ["${mc}/DYto2L-2Jets_MLL-50_TuneCP5_13p6TeV_amcatnloFXFX-pythia8/NANOAODSIM/*/*/*.root"]

[[samples]]
name = "DYto2L_MLL10to50"
kind = "mc"
group = "zjets"
xsec_pb = 19982.0
files = ["${mc}/DYto2L-2Jets_MLL-10to50_TuneCP5_13p6TeV_amcatnloFXFX-pythia8/NANOAODSIM/*/*/*.root"]

[[samples]]
name = "TTtoLNu2Q"
kind = "mc"
group = "ttbar"
xsec_pb = 924.0
branching_ratio = 0.4393
files = ["${mc}/TTtoLNu2Q_TuneCP5_13p6TeV_powheg-pythia8/NANOAODSIM/*/*/*.root"]

# Data primary datasets. SingleMuon (run <= 356386) and Muon (run >= 356426) do not
# overlap in run number, so both use the "Muon" trigger stream.
[[samples]]
name = "MuonEG"
kind = "data"
stream = "MuonEG"
group = "data"
files = ["${data}/MuonEG/NANOAOD/22Sep2023-v1/*/*.root"]

[[samples]]
name = "SingleMuon"
kind = "data"
stream = "Muon"
group = "data"
files = ["${data}/SingleMuon/NANOAOD/22Sep2023-v1/*/*.root"]

[[samples]]
name = "Muon"
kind = "data"
stream = "Muon"
group = "data"
files = ["${data}/Muon/NANOAOD/22Sep2023-v1/*/*.root"]

[[samples]]
name = "EGamma"
kind = "data"
stream = "EGamma"
group = "data"
files = ["${data}/EGamma/NANOAOD/22Sep2023-v1/*/*.root"]

# ---------------------------------------------------------------- data quality, trigger
[data_quality]
run_range = [356309, 356615]    # [AN] 2.2: 27.07-02.08.2022
golden_json = "Cert_Collisions2022_355100_362760_Golden.json"

[triggers]
# [AN] Table 5 + 2.3: e-mu cross triggers OR single-lepton triggers.
priority = ["MuonEG", "Muon", "EGamma"]   # PD overlap removal order
mc = ["emu", "single_mu", "single_e"]

[triggers.groups]
emu = ["HLT_Mu8_TrkIsoVVL_Ele23_CaloIdL_TrackIdL_IsoVL_DZ",
       "HLT_Mu23_TrkIsoVVL_Ele12_CaloIdL_TrackIdL_IsoVL"]
single_mu = ["HLT_IsoMu24"]
single_e = ["HLT_Ele32_WPTight_Gsf"]

[triggers.streams]
MuonEG = ["emu"]
Muon = ["single_mu"]
EGamma = ["single_e"]

# ---------------------------------------------------------------- objects
# Signal (pT > 35) and veto (pT > 10) leptons use the same ID ([AN] 3.1).
# Electron: |eta| < 2.4, ECAL gap 1.444 < |eta_SC| < 1.566 excluded, cut-based tight.
# Muon: |eta| < 2.4, tight ID, PF relative isolation (dR < 0.4) < 0.15.
[[objects]]
name = "electrons"
collection = "Electron"
cut = "pt > 35.0 && abs(eta) < 2.4 && !(1.444 < abs(eta + deltaEtaSC) < 1.566) && cutBased >= 4"

[[objects]]
name = "muons"
collection = "Muon"
cut = "pt > 35.0 && abs(eta) < 2.4 && tightId && pfRelIso04_all < 0.15"

[[objects]]
name = "veto_electrons"
collection = "Electron"
cut = "pt > 10.0 && abs(eta) < 2.4 && !(1.444 < abs(eta + deltaEtaSC) < 1.566) && cutBased >= 4"

[[objects]]
name = "veto_muons"
collection = "Muon"
cut = "pt > 10.0 && abs(eta) < 2.4 && tightId && pfRelIso04_all < 0.15"

# AK4 PUPPI jets: pT > 30, |eta| < 2.4, tight jet ID (jetId bit 2), dR(jet, signal lepton) > 0.4.
[[objects]]
name = "jets"
collection = "Jet"
cut = "pt > 30.0 && abs(eta) < 2.4 && (jetId & 2) != 0"
clean = { against = ["electrons", "muons"], dr = 0.4 }
sort_by = "pt"

# ---------------------------------------------------------------- event selection
[variables]
njet = "length(jets)"
mll = "mass_massless(electrons.pt[1], electrons.eta[1], electrons.phi[1], muons.pt[1], muons.eta[1], muons.phi[1])"
# Selected-lepton kinematics for the scale factors (kept events have exactly one
# electron and one muon). The SC eta is summed in NanoAOD (Float32) precision.
mu1_pt = "muons.pt[1]"
mu1_eta = "muons.eta[1]"
e1_pt = "electrons.pt[1]"
e1_eta_sc = "electrons.eta[1] + electrons.deltaEtaSC[1]"

[output]
columns = ["mu1_pt", "mu1_eta", "e1_pt", "e1_eta_sc"]

[weights]
mc = ["genWeight"]
data = []

[[cuts]]
name = "lumimask"
expr = "lumimask"               # run range + Golden JSON
only = "data"

[[cuts]]
name = "trigger"
expr = "trigger"

[[cuts]]
name = "two_leptons"
expr = "length(electrons) == 1 && length(muons) == 1"

[[cuts]]
name = "extra_lepton_veto"
expr = "length(veto_electrons) == 1 && length(veto_muons) == 1"

[[cuts]]
name = "opposite_sign"
expr = "electrons.charge[1] * muons.charge[1] < 0"

[[cuts]]
name = "mll"
expr = "mll > 20.0"             # [P] Sec.4

[[cuts]]
name = "njet_ge1"
expr = "njet >= 1"

[[cuts]]
name = "njet_ge2"
expr = "njet >= 2"              # [P] Sec.7 counting

[[regions]]
name = "emu_ge1j"               # control plots, combined-fit e-mu category
after = "njet_ge1"

[[regions]]
name = "emu_ge2j"               # cross-section counting
after = "njet_ge2"

# ---------------------------------------------------------------- histograms
# Binning as in the reference fill_control.jl. Underflow dropped, overflow in the last bin.
[[histograms]]
name = "lep_pt"
range = [35.0, 10.0, 205.0]
values = ["electrons.pt[1]", "muons.pt[1]"]
xlabel = "Lepton p_{T} (GeV)"

[[histograms]]
name = "lep_eta"
linspace = [-2.4, 2.4, 20]
values = ["electrons.eta[1]", "muons.eta[1]"]
xlabel = "Lepton #eta"

[[histograms]]
name = "jet1_pt"
range = [30.0, 20.0, 410.0]
values = ["jets.pt[1]"]
when = "njet >= 1"
xlabel = "Leading jet p_{T} (GeV)"

[[histograms]]
name = "jet2_pt"
range = [30.0, 20.0, 410.0]
values = ["jets.pt[2]"]
when = "njet >= 2"
xlabel = "Subleading jet p_{T} (GeV)"

[[histograms]]
name = "jet3_pt"
range = [30.0, 20.0, 410.0]
values = ["jets.pt[3]"]
when = "njet >= 3"
xlabel = "Third jet p_{T} (GeV)"

[[histograms]]
name = "jet1_eta"
linspace = [-2.5, 2.5, 20]
values = ["jets.eta[1]"]
when = "njet >= 1"
xlabel = "Leading jet #eta"

[[histograms]]
name = "mll"
range = [20.0, 20.0, 420.0]
values = ["mll"]
xlabel = "m_{e#mu} (GeV)"

[[histograms]]
name = "njet"
range = [0.5, 1.0, 7.5]
values = ["njet"]
xlabel = "Number of jets"

# ---------------------------------------------------------------- corrections
[hooks]
correct = "Cascade.Systematics.apply_corrections"

[corrections.sets]
muon = "${jsonpog}/MUO/2022_Summer22/muon_Z.json.gz"
electron = "${jsonpog}/EGM/2022_Summer22/electron.json.gz"
pileup = "${jsonpog}/LUM/2022_Summer22/puWeights.json.gz"

[[corrections.object_sf]]
name = "muon_id"
set = "muon"
correction = "NUM_TightID_DEN_TrackerMuons"
object = "muons"
indices = [1]
inputs = { eta = "eta", pt = "pt" }
systematic = "scale_factors"
nominal = "nominal"
up = "systup"
down = "systdown"

[[corrections.object_sf]]
name = "muon_iso"
set = "muon"
correction = "NUM_TightPFIso_DEN_TightID"
object = "muons"
indices = [1]
inputs = { eta = "eta", pt = "pt" }
systematic = "scale_factors"
nominal = "nominal"
up = "systup"
down = "systdown"

# Reco SF: two pt ranges of one correction, varied together as "electron_reco".
[[corrections.object_sf]]
name = "electron_reco"
set = "electron"
correction = "Electron-ID-SF"
object = "electrons"
indices = [1]
when = "pt < 75.0"
inputs = { year = "2022Re-recoBCD", WorkingPoint = "Reco20to75", eta = "eta + deltaEtaSC", pt = "pt" }
systematic = "ValType"
nominal = "sf"
up = "sfup"
down = "sfdown"

[[corrections.object_sf]]
name = "electron_reco"
set = "electron"
correction = "Electron-ID-SF"
object = "electrons"
indices = [1]
when = "pt >= 75.0"
inputs = { year = "2022Re-recoBCD", WorkingPoint = "RecoAbove75", eta = "eta + deltaEtaSC", pt = "pt" }
systematic = "ValType"
nominal = "sf"
up = "sfup"
down = "sfdown"

[[corrections.object_sf]]
name = "electron_id"
set = "electron"
correction = "Electron-ID-SF"
object = "electrons"
indices = [1]
inputs = { year = "2022Re-recoBCD", WorkingPoint = "Tight", eta = "eta + deltaEtaSC", pt = "pt" }
systematic = "ValType"
nominal = "sf"
up = "sfup"
down = "sfdown"

[[corrections.event_weight]]
name = "pileup"
set = "pileup"
correction = "Collisions2022_355100_357900_eraBCD_GoldenJson"
inputs = { NumTrueInteractions = "Pileup_nTrueInt" }
systematic = "weights"
nominal = "nominal"
up = "up"
down = "down"

# Placeholder (see header): no e-mu trigger SF in jsonpog 2022_Summer22. No number
# is assumed here; set nominal/up/down from a trigger-efficiency measurement.
[[corrections.flat]]
name = "trigger_emu"
nominal = 1.0
up = 1.0
down = 1.0

# Nominal JER smearing is chosen by options.jer_nominal (profile jer_candidate).
[[shape_variations]]
name = "JES_Total"
collection = "Jet"
kind = "jes"
corrections = "${jsonpog}/JME/2022_Summer22/jet_jerc.json.gz"
source = "Summer22_22Sep2023_V2_MC_Total_AK4PFPuppi"

[[shape_variations]]
name = "JER"
collection = "Jet"
kind = "jer"
corrections = "${jsonpog}/JME/2022_Summer22/jet_jerc.json.gz"
resolution = "Summer22_22Sep2023_JRV1_MC_PtResolution_AK4PFPuppi"
scale_factor = "Summer22_22Sep2023_JRV1_MC_ScaleFactor_AK4PFPuppi"
smear_file = "${jsonpog}/JME/jer_smear.json.gz"
nominal = false

# Fit: ttbar normalisation in emu >= 1 jet on njet. PLACEHOLDER priors (lumi 1.4%,
# background cross sections, trigger size 0) are technical values, not the
# analysis' systematic model (published luminosity uncertainty: 2.3%).

[fit]
histosys_exclude = ["trigger_emu"]
poi = "mu_ttbar"
signal = ["ttbar"]
channels = [{ region = "emu_ge1j", variable = "njet" }]
impacts = true
profile_interval = true

[[fit.normsys]]
name = "lumi"
size = 0.014
samples = ["all"]
placeholder = true

[[fit.normsys]]
name = "xsec_single_top"
size = 0.10
samples = ["single_top"]
placeholder = true

[[fit.normsys]]
name = "xsec_diboson"
size = 0.10
samples = ["diboson"]
placeholder = true

[[fit.normsys]]
name = "xsec_zjets"
size = 0.20
samples = ["zjets"]
placeholder = true

[[fit.normsys]]
name = "trigger_emu"
size = 0.0
samples = ["all"]
placeholder = true

[plot]
lumi_label = "1.21 fb^{-1}"
logy = ["lep_pt", "jet1_pt", "jet2_pt", "jet3_pt", "mll"]
labels = { ttbar = "t#bar{t}", single_top = "Single t", diboson = "Diboson", zjets = "Z + jets" }
colors = { ttbar = "#C5001A", single_top = "#E377C2", diboson = "#9467BD", zjets = "#1F77B4" }
region_labels = { emu_ge1j = "e#mu, #geq1 jet", emu_ge2j = "e#mu, #geq2 jets" }

# Optional bounded-example convention; see docs/THEORY_WEIGHTS.md.
# No PDF assumption: LHEPdfWeight is absent in the inspected TT input.
[profiles.theory_example.options]
corrections = false
shape_variations = false
fit = false

[[profiles.theory_example.theory_weights]]
name = "scale"
family = "scale"
branch = "LHEScaleWeight"
samples = ["TTto2L2Nu"]
expected_length = 9
indices = [1, 2, 4, 6, 8, 9]
normalization = "relative"
reduction = "envelope"
convention = "Inspected NanoAOD title: 9 muR/muF members; exclude opposite extremes 3/7; docs/THEORY_WEIGHTS.md"

[[profiles.theory_example.theory_weights]]
name = "ISR"
family = "ps"
branch = "PSWeight"
samples = ["TTto2L2Nu"]
expected_length = 4
indices = [1, 3]
normalization = "relative"
reduction = "pair"
convention = "Inspected PS title: ISR scale doubled/halved, FSR fixed; docs/THEORY_WEIGHTS.md"

[[profiles.theory_example.theory_weights]]
name = "FSR"
family = "ps"
branch = "PSWeight"
samples = ["TTto2L2Nu"]
expected_length = 4
indices = [2, 4]
normalization = "relative"
reduction = "pair"
convention = "Inspected PS title: FSR scale doubled/halved, ISR fixed; docs/THEORY_WEIGHTS.md"

# Opt-in combined technical integration, not a final physics prescription.
# Existing profiles/defaults are unchanged; arrays replace under profile merge,
# so the inspected TT-only theory declarations are repeated verbatim below.
# Bounded real validation: docs/TTBAR_INTEGRATION_VALIDATION.md.
[profiles.integration_small.options]
corrections = true
shape_variations = true
fit = true
jer_nominal = true

[[profiles.integration_small.theory_weights]]
name = "scale"
family = "scale"
branch = "LHEScaleWeight"
samples = ["TTto2L2Nu"]
expected_length = 9
indices = [1, 2, 4, 6, 8, 9]
normalization = "relative"
reduction = "envelope"
convention = "Inspected NanoAOD title: 9 muR/muF members; exclude opposite extremes 3/7; docs/THEORY_WEIGHTS.md"

[[profiles.integration_small.theory_weights]]
name = "ISR"
family = "ps"
branch = "PSWeight"
samples = ["TTto2L2Nu"]
expected_length = 4
indices = [1, 3]
normalization = "relative"
reduction = "pair"
convention = "Inspected PS title: ISR scale doubled/halved, FSR fixed; docs/THEORY_WEIGHTS.md"

[[profiles.integration_small.theory_weights]]
name = "FSR"
family = "ps"
branch = "PSWeight"
samples = ["TTto2L2Nu"]
expected_length = 4
indices = [2, 4]
normalization = "relative"
reduction = "pair"
convention = "Inspected PS title: FSR scale doubled/halved, ISR fixed; docs/THEORY_WEIGHTS.md"
