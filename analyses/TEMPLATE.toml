# expected_length = 4
# normalization = "relative"         # or central + central_index;
#                                   # absolute + reference_branch
# reduction = "pair"                 # envelope / replica_std /
#                                   # hessian_symmetric / hessian_pairs
# convention = "Validated generator reference and member mapping"
# cl_scale = 1.0                     # REQUIRED only for PDF reductions
# pdf_template_model = "rank_one"     # REQUIRED acknowledgment for PDF band reducers:
#                                   # single fully correlated bin-shift nuisance,
#                                   # NOT full replica/eigenvector covariance
# Nonlinear envelope/PDF reducers require ONE distinct sample; only pair may
# correlate multiple samples. Independent samples require distinct nuisance names.

